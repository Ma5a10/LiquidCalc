<html lang='ja'>

<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Liquid Calc</title>
  <link rel='stylesheet' href='styles.css'>
  <script src="script.js" type="text/javascript"></script>
</head>

<body>

  <div class="calculator">
    <div class="background-shape shape-1"></div>
    <div class="background-shape shape-2"></div>

    <div class="window-controls">
      <button class="win-btn minimize" id="btnMinimize" title="最小化">−</button>
      <button class="win-btn close" id="btnClose" title="閉じる">✕</button>
    </div>
    <div class="display">
      <div class="previous-operand" id="previousOperand"></div>
      <div class="current-operand" id="currentOperand">0</div>
    </div>
    <div class="buttons">
      <button class="btn function">AC</button>
      <button class="btn function">±</button>
      <button class="btn function">%</button>
      <button class="btn operator">÷</button>

      <button class="btn">7</button>
      <button class="btn">8</button>
      <button class="btn">9</button>
      <button class="btn operator">✕</button>

      <button class="btn">4</button>
      <button class="btn">5</button>
      <button class="btn">6</button>
      <button class="btn operator">-</button>

      <button class="btn">1</button>
      <button class="btn">2</button>
      <button class="btn">3</button>
      <button class="btn operator">+</button>

      <button class="btn zero">0</button>
      <button class="btn">.</button>
      <button class="btn equals">=</button>
    </div>
  </div>
</body>

</html>
